<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="assets/images/icon.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お支払い完了 — miomio</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="miomio サービス利用規約">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #fdfafc;
      --fg:      #1a1118;
      --fg-2:    #6b4456;
      --fg-3:    #b08898;
      --rose:    #bf5b77;
      --rose-lt: #faeaf0;
      --border:  #eedce4;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:      #180f14;
        --fg:      #f2e8ec;
        --fg-2:    #c9a0b2;
        --fg-3:    #856070;
        --rose:    #e07a96;
        --rose-lt: #3a1828;
        --border:  #3d1f2e;
      }
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: "Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",-apple-system,sans-serif;
      font-size: 15px;
      line-height: 1.9;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--rose); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Nav */
    .nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(253,250,252,0.94);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .nav { background: rgba(24,15,20,0.95); }
    }
    .nav__inner {
      max-width: 860px; margin: 0 auto;
      height: 60px; display: flex; align-items: center; justify-content: space-between;
    }
    .logo {
      display: flex; align-items: center;
      font-family: "Hiragino Mincho ProN","YuMincho",serif;
      font-weight: 600; font-size: 16px; letter-spacing: 0.1em; color: var(--fg);
      text-decoration: none;
    }
    .logo img { height: 28px; width: auto; }
    .nav__back {
      font-size: 13px; color: var(--fg-3);
      display: flex; align-items: center; gap: 6px;
    }

    /* Page */
    .page {
      max-width: 720px;
      margin: 0 auto;
      padding: 80px 32px 120px;
    }
    .page__eyebrow {
      font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase;
      color: var(--rose); display: block; margin-bottom: 16px;
    }
    .page__title {
      font-family: "Hiragino Mincho ProN","YuMincho",serif;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 400; letter-spacing: 0.03em;
      margin-bottom: 12px; color: var(--fg);
    }
    .page__date {
      font-size: 13px; color: var(--fg-3); margin-bottom: 64px;
    }

    /* Sections */
    .section {
      margin-bottom: 56px;
      padding-bottom: 56px;
      border-bottom: 1px solid var(--border);
    }
    .section:last-child {
      border-bottom: none; margin-bottom: 0; padding-bottom: 0;
    }
    .section__title {
      font-family: "Hiragino Mincho ProN","YuMincho",serif;
      font-size: 1.1rem; font-weight: 500; letter-spacing: 0.04em;
      color: var(--fg); margin-bottom: 20px;
      display: flex; align-items: baseline; gap: 12px;
    }
    .section__num {
      font-size: 11px; letter-spacing: 0.1em;
      color: var(--rose); font-family: inherit;
    }
    .section p { color: var(--fg-2); margin-bottom: 14px; }
    .section p:last-child { margin-bottom: 0; }

    /* Highlight box */
    .highlight {
      background: var(--rose-lt);
      border-left: 3px solid var(--rose);
      border-radius: 0 8px 8px 0;
      padding: 20px 24px;
      margin: 20px 0;
    }
    .highlight p { color: var(--fg-2); margin-bottom: 10px; }
    .highlight p:last-child { margin-bottom: 0; }

    /* List */
    .list {
      list-style: none;
      display: flex; flex-direction: column; gap: 10px;
      margin: 16px 0;
    }
    .list li {
      display: flex; gap: 12px;
      font-size: 14px; color: var(--fg-2);
    }
    .list li::before {
      content: '—';
      color: var(--rose); flex-shrink: 0; font-size: 13px; line-height: 1.9;
    }

    /* Plan table */
    .plan-table {
      width: 100%; border-collapse: collapse;
      margin: 20px 0; font-size: 14px;
    }
    .plan-table th, .plan-table td {
      padding: 14px 16px;
      border: 1px solid var(--border);
      text-align: left;
      color: var(--fg-2);
    }
    .plan-table th {
      background: var(--rose-lt);
      color: var(--fg);
      font-weight: 600; font-size: 13px;
    }
    .plan-table td:first-child { color: var(--fg); font-weight: 500; }

    /* Footer */
    .footer {
      text-align: center;
      padding: 40px 32px;
      border-top: 1px solid var(--border);
      font-size: 13px; color: var(--fg-3);
    }
    .footer__links {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 20px;
      margin-bottom: 16px;
    }
    .footer__links a { color: var(--fg-3); font-size: 12px; }
    .footer__links a:hover { color: var(--rose); }

    @media (max-width: 600px) {
      .page { padding: 56px 24px 80px; }
      .nav { padding: 0 24px; }
      .plan-table { font-size: 13px; }
      .plan-table th, .plan-table td { padding: 10px 12px; }
    }
  </style>
</head>
<body>

<nav class="nav">

  </div>

<main class="page">

  <div class="section">
    <p>ご契約のお手続きが完了しました。</p>
    <ul class="list">
      <li>アプリのプランへの反映まで、数分かかる場合があります。アプリを開き直して、ご確認ください。</li>
      <li>ご契約内容のご確認や、お支払い履歴は、ご契約時にお送りしたメールの案内をご確認ください。</li>
      <li>ご不明な点は、<a href="/#contact-form">お問い合わせフォーム</a>からご連絡ください。</li>
    </ul>
    <p><a href="index.html">トップページへ戻る</a></p>
  </div>
</main>

<footer class="footer">
  <div class="footer__links">
    <a href="terms.html">利用規約</a>
    <a href="privacy.html">プライバシーポリシー</a>
    <a href="tokusho.html">特定商取引法に基づく表記</a>
  </div>
  © 2025 miomio / 合同会社 About The Engineer. All rights reserved.
</footer>

</body>
</html>
